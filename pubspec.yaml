name: solidui
description: 'A UI library for building Solid applications with Flutter.'
version: 1.0.41
homepage: https://github.com/anusii/solidui

# Scaffold a new Solid Pod file-browser app (a pod browser, with navigation
# rail and status bar, built on solidui) from the bundled template:
#
#   dart run solidui:create my_pod_app
#
# Or, after `flutter pub global activate solidui`:
#
#   solidui create my_pod_app

executables:
  solidui: create

environment:
  sdk: '>=3.2.3 <4.0.0'
  flutter: '>=3.47.0'

# To automatically upgrade package dependencies to the latest versions:
#
#   flutter pub upgrade --major-versions
#
# To see which dependencies have newer versions available:
#
#   flutter pub outdated

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.9
  crypto: ^3.0.7
  encrypter_plus: ^5.1.0
  file_picker: ^12.1.3
  # Pinned below 11.0.0: flutter_form_builder 11.x builds its fields from
  # package:material_ui, whose Material/Theme/MaterialLocalizations are
  # distinct classes from those in package:flutter/material.dart. In a Flutter
  # material app its text fields assert "No Material widget found". Revisit
  # when solidui itself migrates to material_ui.
  flutter_form_builder: '>=10.3.0 <11.0.0'
  flutter_markdown_plus: ^1.0.12
  form_builder_validators: ^11.3.0
  gap: ^3.0.1
  intl: ^0.20.3
  loading_indicator: ^4.0.2
  markdown_tooltip: ^0.0.10
  package_info_plus: ^10.2.1
  path: ^1.9.1
  pdf: ^3.13.0
  printing: ^5.15.0
  rdf: ^1.0.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  solidpod: ^1.0.20
  universal_io: ^2.3.1
  url_launcher: ^6.3.2
  version_widget: ^1.0.10
  window_manager: ^0.5.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/images/
