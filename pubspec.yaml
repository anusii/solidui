name: solidui
description: "A UI library for building Solid applications with Flutter."
version: 0.2.1
homepage: https://github.com/anusii/solidui

environment:
  sdk: ">=3.2.3 <4.0.0"

# To automatically upgrade package dependencies to the latest versions:
#
#   flutter pub upgrade --major-versions
#
# To see which dependencies have newer versions available:
#
#   flutter pub outdated

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.10
  flutter_form_builder: ^10.3.0+1
  flutter_markdown_plus: ^1.0.7
  form_builder_validators: ^11.3.0
  gap: ^3.0.1
  loading_indicator: ^3.1.1
  markdown_tooltip: ^0.0.10
  package_info_plus: ^9.0.0
  path: ^1.9.1
  rdflib: ^0.2.12
  shared_preferences: ^2.5.4
  solidpod: ^0.11.1
  url_launcher: ^6.3.2
  version_widget: ^1.0.6

dependency_overrides:
  solidpod:
    git:
      url: https://github.com/anusii/solidpod.git
      ref: tony/204_pod_initialisation

dev_dependencies:
  flutter_lints: ^6.0.0
  window_manager: ^0.5.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
