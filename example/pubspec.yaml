name: demopod
description: 'A SolidUI Demonstrator.'
publish_to: 'none'
version: 1.0.0+0

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  editable: ^2.0.0
  file_picker: ^12.1.3
  flutter:
    sdk: flutter
  intl: ^0.20.3
  markdown_tooltip: ^0.0.10
  path: ^1.9.1
  rdflib: ^0.2.13
  solidpod: ^1.0.19
  solidui:
    path: ..
  universal_io: ^2.3.1
  window_manager: ^0.5.2

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/images/
