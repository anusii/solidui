name: demopod
description: 'SolidGUI Demonstrator.'
publish_to: 'none'
version: 1.0.0+0

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  editable: ^2.0.0
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  intl: any
  markdown_tooltip: ^0.0.10
  rdflib: ^0.2.12
  solidpod: ^0.12.4
  solidui:
    path: ..
  universal_io: ^2.3.1
  window_manager: ^0.5.1

dependency_overrides:
  solidpod:
    git:
      url: https://github.com/anusii/solidpod.git
      ref: tony/587_check_file_encryption

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
